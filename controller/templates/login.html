<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaveNotify - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn {
            background: #667eea;
            color: white;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #4a5ed6;
        }
        .register-btn {
            background: #28a745;
            color: white;
            margin-top: 10px;
        }
        .register-btn:hover {
            background: #218838;
        }
        .link {
            margin-top: 15px;
            font-size: 14px;
        }
        .link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .link a:hover {
            text-decoration: underline;
        }

        /* Updated Snackbar Styling */
        .snackbar {
            position: fixed;
            top: -60px; /* Initially hidden */
            left: 50%;
            transform: translateX(-50%);
            min-width: 300px;
            padding: 15px;
            color: white;
            text-align: center;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.5s ease-in-out;
            z-index: 1000;
        }

        .snackbar.show {
            top: 20px; /* Moves into view */
            opacity: 1;
        }

        .snackbar.success {
            background-color: #28a745;
        }

        .snackbar.error {
            background-color: #dc3545;
        }

        .snackbar .close-btn {
            border: none;
            background: transparent;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="snackbar"></div>

        <h2>Welcome to KaveNotify</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="userid">User ID</label>
                <input type="text" id="userid" name="userid" placeholder="Enter your User ID" required />
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required />
            </div>

            <button type="submit" class="btn login-btn">Login</button>
        </form>

        <button onclick="window.location.href='/register'" class="btn register-btn">
            Register
        </button>

        <p class="link">
            Forgot Password? <a href="/forgot-password">Reset Here</a>
        </p>
    </div>

    <script>
        function showSnackbar(message, type = "success") {
            const snackbar = document.getElementById("snackbar");
            snackbar.innerHTML = `${message} <button class="close-btn" onclick="hideSnackbar()">×</button>`;
            snackbar.className = `snackbar ${type} show`;

            // Auto-hide after 3 seconds
            setTimeout(() => {
                hideSnackbar();
            }, 1000);
        }

        function hideSnackbar() {
            const snackbar = document.getElementById("snackbar");
            snackbar.classList.remove("show");
        }

        document.getElementById("login-form").addEventListener("submit", async function (event) {
            event.preventDefault();
            const userid = document.getElementById("userid").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userid, password }),
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem("session_id", result.data.session_id);
                    showSnackbar(result.message, "success");
                    setTimeout(() => {
                        window.location.href = result.data.redirect_page; // Redirect after 3 seconds
                    }, 1000);
                } else {
                    showSnackbar(result.message || "Login failed!", "error");
                }
            } catch (error) {
                showSnackbar("Network error. Please try again.", "error");
            }
        });
    </script>
</body>
</html>
